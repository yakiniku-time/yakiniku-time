<!-- ============================================================
     第一步：type="module" 負責同 Firebase 溝通 (瀏覽器原生識ES module，唔使Babel搞)

     ============================================================ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
  setPersistence, browserLocalPersistence, indexedDBLocalPersistence,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, onSnapshot, addDoc, updateDoc, deleteDoc,
  query, orderBy, where, getDocs, setDoc, getDoc, serverTimestamp,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD0z5VwaGDRxkg0-uArNWvSU4Cz3stytOw",
  authDomain: "yakiniku-time.firebaseapp.com",
  projectId: "yakiniku-time",
  storageBucket: "yakiniku-time.firebasestorage.app",
  messagingSenderId: "625670294104",
  appId: "1:625670294104:web:e0fdc041d20e942d9cd82d",
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
// 明確用最持久嗰種登入狀態記錄方式，盡量做到「登入一次，之後唔使再login」
try {
  await setPersistence(auth, indexedDBLocalPersistence);
} catch {
  await setPersistence(auth, browserLocalPersistence);
}

const EMAIL_DOMAIN = "yakiniku-time.local";
const usernameToEmail = (u) => `${u.trim().toLowerCase().replace(/\s+/g, "")}@${EMAIL_DOMAIN}`;
const emailToUsername = (e) => e.split("@")[0];

const bookingsCol = collection(db, "bookings");
function listenBookings(cb) {
  // 淨係用一個orderBy，唔使Firestore composite index；時間排序喺瀏覽器度自己做
  const q = query(bookingsCol, orderBy("date"));
  return onSnapshot(q, (snap) => {
    const list = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    list.sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")));
    cb(list);
  }, (err) => console.error("listenBookings error:", err));
}
async function countArrivedFor(igHandle, threadsHandle) {
  if (!igHandle && !threadsHandle) return 0;
  const snap = await getDocs(query(bookingsCol, where("status", "==", "arrived")));
  let count = 0;
  snap.forEach((d) => {
    const data = d.data();
    if ((igHandle && data.igHandle === igHandle) || (threadsHandle && data.threadsHandle === threadsHandle)) count += 1;
  });
  return count;
}
async function addBooking({ name, igHandle, threadsHandle, date, time, source, status }) {
  // foodie自己(未登入)冇讀取權限，唔可以喺呢步計「第幾次到訪」，
  // 淨係店員/管理員開位先即刻計；自約嘅留返店員打勾「已到」嗰陣先計
  let visitNo = null;
  const initialStatus = status || "pending";
  if (source === "staff") {
    visitNo = (await countArrivedFor(igHandle, threadsHandle)) + 1;
  }
  return addDoc(bookingsCol, {
    name, igHandle: igHandle || "", threadsHandle: threadsHandle || "",
    date, time: time || "", source, status: initialStatus, visitNo,
    eff: { d3: null, d7: null },
    createdAt: serverTimestamp(),
  });
}
async function toggleArrived(id, currentStatus, booking) {
  const willArrive = currentStatus !== "arrived";
  const updates = { status: willArrive ? "arrived" : "pending" };
  if (willArrive && (booking?.visitNo === null || booking?.visitNo === undefined)) {
    updates.visitNo = (await countArrivedFor(booking?.igHandle, booking?.threadsHandle)) + 1;
  }
  return updateDoc(doc(db, "bookings", id), updates);
}
function updateEffectiveness(id, phase, field, value, existingPhaseObj) {
  const phaseObj = existingPhaseObj || { views: 0, likes: 0, comments: 0 };
  return updateDoc(doc(db, "bookings", id), { [`eff.${phase}`]: { ...phaseObj, [field]: Number(value) || 0 } });
}

const dailyCol = collection(db, "dailyStats");
function listenDaily(cb) {
  const q = query(dailyCol, orderBy("__name__"));
  return onSnapshot(q, (snap) => cb(snap.docs.map((d) => ({ date: d.id, ...d.data() }))), (err) => console.error(err));
}
function upsertDaily(date, fields) {
  return setDoc(doc(db, "dailyStats", date), fields, { merge: true });
}

const accountsCol = collection(db, "accounts");
function listenAccounts(cb) {
  return onSnapshot(accountsCol, (snap) => cb(snap.docs.map((d) => ({ email: d.id, ...d.data() }))), (err) => console.error(err));
}
function addAccountRole(email, name, role) {
  return setDoc(doc(db, "accounts", email.toLowerCase()), { name, role });
}
function removeAccountRole(email) {
  return deleteDoc(doc(db, "accounts", email.toLowerCase()));
}
async function getAccountRole(email) {
  const snap = await getDoc(doc(db, "accounts", email.toLowerCase()));
  return snap.exists() ? snap.data() : null;
}

/* ---------------- 生日優惠 ---------------- */
const birthdayCol = collection(db, "birthdayFans");
function listenBirthdayFans(cb) {
  return onSnapshot(birthdayCol, (snap) => {
    cb(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
  }, (err) => console.error("listenBirthdayFans error:", err));
}
function addBirthdayFan({ name, phone, birthday, source }) {
  return addDoc(birthdayCol, {
    name, phone: phone || "", birthday, source: source || "staff",
    redeemedYear: null,
    createdAt: serverTimestamp(),
  });
}
function setBirthdayRedeemed(id, year) {
  return updateDoc(doc(db, "birthdayFans", id), { redeemedYear: year });
}
function clearBirthdayRedeemed(id) {
  return updateDoc(doc(db, "birthdayFans", id), { redeemedYear: null });
}

window.FB = {
  auth, usernameToEmail, emailToUsername,
  signInWithEmailAndPassword, signOut, onAuthStateChanged,
  listenBookings, addBooking, toggleArrived, updateEffectiveness,
  listenDaily, upsertDaily,
  listenAccounts, addAccountRole, removeAccountRole, getAccountRole,
  listenBirthdayFans, addBirthdayFan, setBirthdayRedeemed, clearBirthdayRedeemed,
};
window.__fbReady = true;
window.dispatchEvent(new Event("fbready"));
</script>

// 用返本地日曆日期計，唔好用toISOString(佢會換做UTC，喺香港時區會做成日期錯咗一日/一個月)
function ymd(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function addDays(dateStr, n) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return ymd(d);
}
function startOfMonth(dateStr) { return dateStr.slice(0, 7) + "-01"; }
function endOfMonth(dateStr) {
  const d = new Date(dateStr.slice(0, 7) + "-01T00:00:00");
  d.setMonth(d.getMonth() + 1);
  d.setDate(0);
  return ymd(d);
}
function prevMonthDate(dateStr) {
  const d = new Date(dateStr.slice(0, 7) + "-01T00:00:00");
  d.setMonth(d.getMonth() - 1);
  return ymd(d);
}
// 週日 = 一週開始，週六 = 一週結束
function startOfWeek(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() - d.getDay());
  return ymd(d);
}
function endOfWeek(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + (6 - d.getDay()));
  return ymd(d);
}

function StatBox({ label, value, deltaLabel, deltaValue, deltaIsPct }) {
  const hasDelta = deltaValue !== null && deltaValue !== undefined;
  const up = hasDelta && deltaValue > 0;
  const flat = hasDelta && deltaValue === 0;
  return (
    <div className="rounded-md border border-[#C9A66B] bg-white/70 p-4 text-center">
      <div className="text-2xl font-extrabold text-[#1C1917]">{value}</div>
      <div className="text-[11px] text-stone-500 mb-1">{label}</div>
      {hasDelta && (
        <div className={`text-xs font-semibold ${flat ? "text-stone-400" : up ? "text-[#8a9a3c]" : "text-[#B8262A]"}`}>
          {flat ? "同上期持平" : `${up ? "▲" : "▼"} ${up ? "+" : ""}${deltaValue.toLocaleString()}${deltaIsPct ? "%" : ""} 對比${deltaLabel}`}
        </div>
      )}
    </div>
  );
}

function Stats() {
  const [bookings, setBookings] = useState([]);
  const [daily, setDaily] = useState([]);
  const [period, setPeriod] = useState("week"); // week | month | custom
  const today = ymd(new Date());
  const [customStart, setCustomStart] = useState(addDays(today, -6));
  const [customEnd, setCustomEnd] = useState(today);

  useEffect(() => window.FB.listenBookings(setBookings), []);
  useEffect(() => window.FB.listenDaily(setDaily), []);

  let start, end, prevStart, prevEnd, rangeLabel, prevLabel;
  if (period === "week") {
    start = startOfWeek(today); end = endOfWeek(today);
    prevEnd = addDays(start, -1); prevStart = addDays(prevEnd, -6);
    rangeLabel = "本週(日至六)"; prevLabel = "上週";
  } else if (period === "month") {
    start = startOfMonth(today); end = today;
    const pm = prevMonthDate(today);
    prevStart = startOfMonth(pm); prevEnd = endOfMonth(pm);
    rangeLabel = "本月"; prevLabel = "上月";
  } else {
    start = customStart; end = customEnd;
    const len = Math.round((new Date(end) - new Date(start)) / 86400000) + 1;
    prevEnd = addDays(start, -1); prevStart = addDays(prevEnd, -(len - 1));
    rangeLabel = "自訂期間"; prevLabel = "上一個對等期間";
  }

  const inRange = (d, s, e) => d >= s && d <= e;
  const foodieCount = (s, e) => bookings.filter((b) => b.status === "arrived" && inRange(b.date, s, e)).length;
  const dailyInRange = (s, e) => daily.filter((d) => inRange(d.date, s, e)).sort((a, b) => a.date.localeCompare(b.date));
  const sumRevenue = (s, e) => dailyInRange(s, e).reduce((sum, d) => sum + (d.revenue || 0), 0);
  const growth = (s, e, field) => {
    const rows = dailyInRange(s, e);
    if (rows.length === 0) return null;
    return (rows[rows.length - 1][field] ?? 0) - (rows[0][field] ?? 0);
  };

  const cur = {
    foodie: foodieCount(start, end),
    revenue: sumRevenue(start, end),
    wa: growth(start, end, "waMembers"),
    ig: growth(start, end, "igFollowers"),
  };
  const prev = {
    foodie: foodieCount(prevStart, prevEnd),
    revenue: sumRevenue(prevStart, prevEnd),
  };

  return (
    <div>
      <h2 className="text-xl font-extrabold flex items-center gap-2 mb-3">📈 統計報表</h2>
      <div className="flex gap-1 mb-4 bg-white/60 border border-[#C9A66B] rounded-md p-1 w-fit">
        {[["week", "本週"], ["month", "本月"], ["custom", "自訂"]].map(([id, label]) => (
          <button key={id} onClick={() => setPeriod(id)} className={`px-3 py-1.5 text-sm font-bold rounded-sm ${period === id ? "bg-[#1C1917] text-[#F3EBD9]" : "text-stone-500"}`}>{label}</button>
        ))}
      </div>
      {period === "custom" && (
        <div className="flex items-center gap-2 mb-4 text-sm">
          <input type="date" value={customStart} onChange={(e) => setCustomStart(e.target.value)} className="border border-[#C9A66B] rounded-sm px-2 py-1.5 bg-white" />
          <span className="text-stone-400">至</span>
          <input type="date" value={customEnd} onChange={(e) => setCustomEnd(e.target.value)} className="border border-[#C9A66B] rounded-sm px-2 py-1.5 bg-white" />
        </div>
      )}
      <p className="text-xs text-stone-500 mb-3">{rangeLabel}（{fmtDate(start)} — {fmtDate(end)}），對比{prevLabel}（{fmtDate(prevStart)} — {fmtDate(prevEnd)}）</p>
      <div className="grid grid-cols-2 gap-3">
        <StatBox label="食評家到訪" value={cur.foodie} deltaValue={cur.foodie - prev.foodie} deltaLabel={prevLabel} />
        <StatBox label="總營業額 (HK$)" value={cur.revenue.toLocaleString()} deltaValue={cur.revenue - prev.revenue} deltaLabel={prevLabel} />
        <StatBox label="WhatsApp 群組增長" value={cur.wa === null ? "—" : `${cur.wa >= 0 ? "+" : ""}${cur.wa}`} />
        <StatBox label="IG/Threads Follower 增長" value={cur.ig === null ? "—" : `${cur.ig >= 0 ? "+" : ""}${cur.ig}`} />
      </div>
      {daily.length === 0 && <p className="text-sm text-stone-400 mt-4">未有「每日統計」數據，先去嗰頁記錄多幾日。</p>}
    </div>
  );
}

function birthdayWindowInfo(birthday, todayStr) {
  // 揾返「今年/去年/明年」呢個生日對應嘅日期，邊個窗口(前後一日)蓋住咗今日就用邊個
  const md = birthday.slice(5); // MM-DD
  const y = Number(todayStr.slice(0, 4));
  const candidates = [y - 1, y, y + 1].map((yr) => `${yr}-${md}`);
  let active = null, upcoming = null;
  for (const occ of candidates) {
    const start = addDays(occ, -1), end = addDays(occ, 1);
    if (todayStr >= start && todayStr <= end) { active = { occ, start, end, year: occ.slice(0, 4) }; break; }
  }
  if (!active) {
    // 揾最近一個未到嘅窗口
    const future = candidates
      .map((occ) => ({ occ, start: addDays(occ, -1), end: addDays(occ, 1), year: occ.slice(0, 4) }))
      .filter((w) => w.start > todayStr)
      .sort((a, b) => a.start.localeCompare(b.start));
    upcoming = future[0] || null;
  }
  return { active, upcoming };
}

      setAccount(null);
    }
  }), []);

  if (authUser === undefined) return <div className="min-h-screen flex items-center justify-center bg-[#F3EBD9] text-stone-500">載入緊…</div>;
  if (!authUser) return <Login />;
  if (!account) return (
    <div className="min-h-screen flex items-center justify-center bg-[#F3EBD9] px-4 text-center">
      <div><p className="font-bold mb-2">呢個帳號未設定權限</p>
      <p className="text-sm text-stone-500 mb-4">請叫管理員喺「帳號管理」加返你嘅帳號名（{window.FB.emailToUsername(authUser.email)}）</p>
      <button onClick={() => window.FB.signOut(window.FB.auth)} className="text-sm underline text-[#B8262A]">登出</button></div>
    </div>
  );

  const role = account.role;
  const readOnly = role === "viewer";
  const canSeeReports = role === "admin" || role === "viewer";
  const tabs = [
    { id: "schedule", label: "時間表", icon: "📅" },
    { id: "log", label: "訪客記錄", icon: "🔍" },
    { id: "birthday", label: "生日優惠", icon: "🎂" },
  ];
  if (canSeeReports) tabs.push(
    { id: "eff", label: "成效追蹤", icon: "🔥" },
    { id: "monthly", label: "統計報表", icon: "📈" },
    { id: "daily", label: "每日統計", icon: "🛡️" },
  );
  if (role === "admin") tabs.push({ id: "accounts", label: "帳號管理", icon: "👤" });

  const roleLabel = role === "admin" ? "管理員" : role === "viewer" ? "老闆" : "店員";

  return (
    <div className="min-h-screen bg-[#F3EBD9] text-[#211B14]">
      <header className="border-b-4 border-[#1C1917] bg-[#1C1917] text-[#F3EBD9]">
        <div className="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
          <div className="flex items-center gap-3">
            <LogoMark size={48} />
            <div><h1 className="text-lg font-extrabold leading-tight tracking-wide">燒肉時刻 · 食評家記錄</h1>
            <p className="text-[11px] text-[#C9A66B] tracking-widest uppercase">Yakiniku Time · KOL Manager</p></div>
          </div>
          <div className="flex items-center gap-3">
            <span className="text-xs text-[#C9A66B] hidden sm:inline">{account.name} · {roleLabel}</span>
            <button onClick={() => window.FB.signOut(window.FB.auth)} className="text-xs font-bold text-[#F3EBD9] border border-[#C9A66B] rounded-sm px-2 py-1.5">登出</button>
          </div>
        </div>
        <nav className="max-w-5xl mx-auto px-4 flex flex-wrap gap-1">
          {tabs.map((t) => (
            <button key={t.id} onClick={() => setTab(t.id)} className={`flex items-center gap-1.5 px-3 py-2 text-sm font-bold whitespace-nowrap border-b-2 transition ${tab === t.id ? "border-[#B8262A] text-[#F3EBD9]" : "border-transparent text-[#8a8067]"}`}>
              {t.icon} {t.label}
            </button>
          ))}
        </nav>
      </header>
      <main className="max-w-5xl mx-auto px-4 py-5 pb-16">
        {tab === "schedule" && <Schedule readOnly={readOnly} />}
        {tab === "log" && <LogTab />}
        {tab === "birthday" && <BirthdayOffer readOnly={readOnly} />}
        {tab === "eff" && canSeeReports && <Effectiveness readOnly={readOnly} />}
        {tab === "monthly" && canSeeReports && <Stats />}
        {tab === "daily" && canSeeReports && <Daily readOnly={readOnly} />}
        {tab === "accounts" && role === "admin" && <Accounts />}
      </main>
      <footer className="border-t border-[#C9A66B] py-3 text-center text-[11px] text-stone-500">燒肉時刻 · 內部管理系統</footer>
    </div>
  );
}

function Root() {
  const [hash, setHash] = useState(window.location.hash);
  useEffect(() => {
    const onHashChange = () => setHash(window.location.hash);
    window.addEventListener("hashchange", onHashChange);
    return () => window.removeEventListener("hashchange", onHashChange);
  }, []);
  if (hash.startsWith("#/book")) return <PublicBooking />;
  if (hash.startsWith("#/birthday")) return <PublicBirthday />;
  return <MainApp />;
}

function boot() {
  ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
}

if (window.__fbReady) {
  boot();
} else {
  window.addEventListener("fbready", boot);
}
</script>
</body>
</html>
