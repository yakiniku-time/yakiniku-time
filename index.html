<script type="text/babel" data-presets="react" data-type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, onSnapshot, addDoc, updateDoc, deleteDoc,
  query, orderBy, where, getDocs, setDoc, getDoc, serverTimestamp,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const { useState, useEffect } = React;

/* =========================================================
   1. Firebase 設定 —— 呢段已經幫你填咗你個project嘅config
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyD0z5VwaGDRxkg0-uArNWvSU4Cz3stytOw",
  authDomain: "yakiniku-time.firebaseapp.com",
  projectId: "yakiniku-time",
  storageBucket: "yakiniku-time.firebasestorage.app",
  messagingSenderId: "625670294104",
  appId: "1:625670294104:web:e0fdc041d20e942d9cd82d",
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* =========================================================
   2. 帳號名 <-> 電郵 轉換 (Firebase Auth 淨係識電郵格式)
   ========================================================= */
const EMAIL_DOMAIN = "yakiniku-time.local";
const usernameToEmail = (u) => `${u.trim().toLowerCase().replace(/\s+/g, "")}@${EMAIL_DOMAIN}`;
const emailToUsername = (e) => e.split("@")[0];

/* =========================================================
   3. Firestore 資料操作
   ========================================================= */
const bookingsCol = collection(db, "bookings");

function listenBookings(cb) {
  const q = query(bookingsCol, orderBy("date"), orderBy("time"));
  return onSnapshot(q, (snap) => cb(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
}
async function nextVisitNo(igHandle, threadsHandle) {
  if (!igHandle && !threadsHandle) return 1;
  const snap = await getDocs(query(bookingsCol, where("status", "==", "arrived")));
  let count = 0;
  snap.forEach((d) => {
    const data = d.data();
    if ((igHandle && data.igHandle === igHandle) || (threadsHandle && data.threadsHandle === threadsHandle)) count += 1;
  });
  return count + 1;
}
async function addBooking({ name, igHandle, threadsHandle, date, time, source }) {
  const visitNo = await nextVisitNo(igHandle, threadsHandle);
  return addDoc(bookingsCol, {
    name, igHandle: igHandle || "", threadsHandle: threadsHandle || "",
    date, time, source, status: "pending", visitNo,
    eff: { d3: null, d7: null },
    createdAt: serverTimestamp(),
  });
}
function toggleArrived(id, currentStatus) {
  return updateDoc(doc(db, "bookings", id), { status: currentStatus === "arrived" ? "pending" : "arrived" });
}
function updateEffectiveness(id, phase, field, value, existingPhaseObj) {
  const phaseObj = existingPhaseObj || { views: 0, likes: 0, comments: 0 };
  return updateDoc(doc(db, "bookings", id), { [`eff.${phase}`]: { ...phaseObj, [field]: Number(value) || 0 } });
}

const dailyCol = collection(db, "dailyStats");
function listenDaily(cb) {
  const q = query(dailyCol, orderBy("__name__"));
  return onSnapshot(q, (snap) => cb(snap.docs.map((d) => ({ date: d.id, ...d.data() }))));
}
function upsertDaily(date, fields) {
  return setDoc(doc(db, "dailyStats", date), fields, { merge: true });
}

const accountsCol = collection(db, "accounts");
function listenAccounts(cb) {
  return onSnapshot(accountsCol, (snap) => cb(snap.docs.map((d) => ({ email: d.id, ...d.data() }))));
}
function addAccountRole(email, name, role) {
  return setDoc(doc(db, "accounts", email.toLowerCase()), { name, role });
}
function removeAccountRole(email) {
  return deleteDoc(doc(db, "accounts", email.toLowerCase()));
}
async function getAccountRole(email) {
  const snap = await getDoc(doc(db, "accounts", email.toLowerCase()));
  return snap.exists() ? snap.data() : null;
}

/* =========================================================
   4. 共用小組件
   ========================================================= */
function fmtDate(d) {
  const dt = new Date(d + "T00:00:00");
  const days = ["日", "一", "二", "三", "四", "五", "六"];
  return `${dt.getMonth() + 1}/${dt.getDate()} (週${days[dt.getDay()]})`;
}

function LogoMark({ size = 48 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 100 100" className="shrink-0">
      <rect x="1" y="1" width="98" height="98" rx="14" fill="#1C1917" stroke="#C9A66B" strokeWidth="2" />
      <circle cx="50" cy="42" r="24" fill="#B8262A" opacity="0.9" />
      <circle cx="50" cy="42" r="24" fill="none" stroke="#8f1c1f" strokeWidth="1.5" opacity="0.6" />
      <g stroke="#1C1917" strokeWidth="3.2" strokeLinecap="round">
        <line x1="26" y1="56" x2="74" y2="56" /><line x1="22" y1="63" x2="78" y2="63" />
        <line x1="30" y1="49" x2="35" y2="70" /><line x1="42" y1="49" x2="45" y2="70" />
        <line x1="55" y1="49" x2="58" y2="70" /><line x1="68" y1="49" x2="70" y2="70" />
      </g>
      <path d="M50 20c3 5-2 7-1 12 4-2 5-6 5-9 5 4 6 11 2 16-3 4-9 4-12 0-3-4-2-10 2-14 1-2 3-3 4-5z" fill="#F2A93B" />
      <path d="M49 25c1 4-1 6-1 9 3-1 4-4 3-7 3 3 3 8 0 11-2 2-6 2-8-0.5-2-3-1-7 2-10 1-1 3-2 4-2.5z" fill="#F7EFDD" opacity="0.85" />
      <rect x="72" y="70" width="20" height="20" rx="3" fill="#B8262A" stroke="#F7EFDD" strokeWidth="1" />
      <text x="82" y="84" textAnchor="middle" fontSize="11" fontWeight="700" fill="#F7EFDD">時</text>
    </svg>
  );
}

function Seal({ children, tone = "vermilion" }) {
  const tones = {
    vermilion: "bg-[#B8262A] text-[#F7EFDD] border-[#8f1c1f]",
    gold: "bg-[#C9A66B] text-[#241C12] border-[#a8895a]",
    ink: "bg-[#1C1917] text-[#F7EFDD] border-[#000]",
  };
  return <span className={`inline-flex items-center gap-1 rounded-sm border px-2 py-0.5 text-[11px] font-bold tracking-wide ${tones[tone]}`}>{children}</span>;
}

/* =========================================================
   5. Foodie 自助登記頁 (#/book，唔使login)
   ========================================================= */
function PublicBooking() {
  const today = new Date().toISOString().slice(0, 10);
  const [form, setForm] = useState({ name: "", igHandle: "", threadsHandle: "", date: today, time: "18:00" });
  const [done, setDone] = useState(false);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  const submit = async (e) => {
    e.preventDefault();
    if (!form.name || (!form.igHandle && !form.threadsHandle)) { setError("請至少填名同一個IG或Threads帳號"); return; }
    setError(""); setSaving(true);
    try { await addBooking({ ...form, source: "self" }); setDone(true); }
    catch { setError("提交失敗，唔該叫店員幫手手動登記"); }
    finally { setSaving(false); }
  };

  if (done) return (
    <div className="min-h-screen flex items-center justify-center bg-[#F3EBD9] px-4 text-center">
      <div><LogoMark size={56} /><p className="mt-4 font-bold text-lg">登記成功！多謝支持燒肉時刻 🔥</p>
      <p className="text-sm text-stone-500 mt-1">我哋已收到你嘅到訪安排，職員會為你準備。</p></div>
    </div>
  );

  return (
    <div className="min-h-screen flex items-center justify-center bg-[#F3EBD9] px-4">
      <form onSubmit={submit} className="w-full max-w-sm bg-white/70 border border-[#C9A66B] rounded-md p-6 space-y-3">
        <div className="flex flex-col items-center gap-2 mb-2"><LogoMark size={56} /><h1 className="font-extrabold text-lg">食評家到訪登記</h1></div>
        <input placeholder="稱呼 / 名" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} className="w-full border border-[#C9A66B] rounded-sm px-3 py-2 text-sm bg-white" />
        <input placeholder="@ IG 帳號 (如有)" value={form.igHandle} onChange={(e) => setForm({ ...form, igHandle: e.target.value })} className="w-full border border-[#C9A66B] rounded-sm px-3 py-2 text-sm bg-white" />
        <input placeholder="@ Threads 帳號 (如有)" value={form.threadsHandle} onChange={(e) => setForm({ ...form, threadsHandle: e.target.value })} className="w-full border border-[#C9A66B] rounded-sm px-3 py-2 text-sm bg-white" />
        <div className="flex gap-2">
          <input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} className="flex-1 border border-[#C9A66B] rounded-sm px-3 py-2 text-sm bg-white" />
          <input type="time" value={form.time} onChange={(e) => setForm({ ...form, time: e.target.value })} className="flex-1 border border-[#C9A66B] rounded-sm px-3 py-2 text-sm bg-white" />
        </div>
        {error && <p className="text-xs text-[#B8262A]">{error}</p>}
        <button type="submit" disabled={saving} className="w-full bg-[#B8262A] text-white font-bold py-2 rounded-sm disabled:opacity-50">{saving ? "提交緊…" : "登記"}</button>
      </form>
    </div>
  );
}

/* =========================================================
   6. 登入頁
   ========================================================= */
function Login() {
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault(); setError(""); setLoading(true);
    try { await signInWithEmailAndPassword(auth, usernameToEmail(username), password); }
    catch { setError("登入失敗，check多次帳號名/密碼"); }
    finally { setLoading(false); }
  };

  return (
    <div className="min-h-screen flex items-center justify-center bg-[#F3EBD9] px-4">
      <form onSubmit={handleSubmit} className="w-full max-w-sm bg-white/70 border border-[#C9A66B] rounded-md p-6 space-y-4">
        <div className="flex flex-col items-center gap-2 mb-2"><LogoMark size={56} /><h1 className="font-extrabold text-lg">燒肉時刻 · 食評家記錄</h1></div>
        <input type="text" required placeholder="帳號名稱" value={username} onChange={(e) => setUsername(e.target.value)} className="w-full border border-[#C9A66B] rounded-sm px-3 py-2 text-sm bg-white" />
        <input type="password" required placeholder="密碼" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full border border-[#C9A66B] rounded-sm px-3 py-2 text-sm bg-white" />
        {error && <p className="text-xs text-[#B8262A]">{error}</p>}
        <button type="submit" disabled={loading} className="w-full bg-[#1C1917] text-white font-bold py-2 rounded-sm disabled:opacity-50">{loading ? "登入緊…" : "登入"}</button>
      </form>
    </div>
  );
}

/* =========================================================
   7. 時間表
   ========================================================= */
function Schedule() {
  const [bookings, setBookings] = useState([]);
  const [showAdd, setShowAdd] = useState(false);
  const [nb, setNb] = useState({ name: "", igHandle: "", threadsHandle: "", date: new Date().toISOString().slice(0, 10), time: "18:00" });

  useEffect(() => listenBookings(setBookings), []);
  const grouped = bookings.reduce((acc, b) => { (acc[b.date] = acc[b.date] || []).push(b); return acc; }, {});

  const submitAdd = async () => {
    if (!nb.name) return;
    await addBooking({ ...nb, source: "staff" });
    setNb({ name: "", igHandle: "", threadsHandle: "", date: new Date().toISOString().slice(0, 10), time: "18:00" });
    setShowAdd(false);
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <h2 className="text-xl font-extrabold flex items-center gap-2">🔥 時間表</h2>
        <button onClick={() => setShowAdd(true)} className="flex items-center gap-1 bg-[#B8262A] text-white text-sm font-bold px-3 py-1.5 rounded-sm">＋ 開位</button>
      </div>
      {showAdd && (
        <div className="mb-4 bg-white/70 border border-[#C9A66B] rounded-md p-3 grid grid-cols-2 gap-2">
          <input placeholder="食評家名" value={nb.name} onChange={(e) => setNb({ ...nb, name: e.target.value })} className="col-span-2 border border-[#C9A66B] rounded-sm px-2 py-1.5 text-sm bg-white" />
          <input placeholder="@ IG 帳號" value={nb.igHandle} onChange={(e) => setNb({ ...nb, igHandle: e.target.value })} className="border border-[#C9A66B] rounded-sm px-2 py-1.5 text-sm bg-white" />
          <input placeholder="@ Threads 帳號" value={nb.threadsHandle} onChange={(e) => setNb({ ...nb, threadsHandle: e.target.value })} className="border border-[#C9A66B] rounded-sm px-2 py-1.5 text-sm bg-white" />
          <input type="date" value={nb.date} onChange={(e) => setNb({ ...nb, date: e.target.value })} className="border border-[#C9A66B] rounded-sm px-2 py-1.5 text-sm bg-white" />
          <input type="time" value={nb.time} onChange={(e) => setNb({ ...nb, time: e.target.value })} className="border border-[#C9A66B] rounded-sm px-2 py-1.5 text-sm bg-white" />
          <div className="col-span-2 flex gap-2 justify-end mt-1">
            <button onClick={() => setShowAdd(false)} className="text-xs px-3 py-1.5 rounded-sm border border-stone-400 text-stone-600">取消</button>
            <button onClick={submitAdd} className="text-xs px-3 py-1.5 rounded-sm bg-[#1C1917] text-white font-bold">加入時間表</button>
          </div>
        </div>
      )}
      {Object.keys(grouped).sort().map((date) => (
        <div key={date} className="mb-5">
          <div className="flex items-center gap-2 mb-2">
            <span className="font-extrabold text-sm bg-[#1C1917] text-[#F3EBD9] px-2 py-0.5 rounded-sm">{fmtDate(date)}</span>
            <div className="flex-1 h-px bg-[#C9A66B]" />
          </div>
          <div className="space-y-2">
            {grouped[date].map((b) => (
              <div key={b.id} className={`flex items-center gap-3 rounded-md border p-3 bg-white/60 ${b.status === "arrived" ? "border-[#8a9a3c]" : "border-[#C9A66B]"}`}>
                <button onClick={() => toggleArrived(b.id, b.status)} className="shrink-0 text-2xl leading-none">{b.status === "arrived" ? "✅" : "⭕"}</button>
                <div className="font-bold text-sm w-14 shrink-0">⏰ {b.time}</div>
                <div className="flex-1 min-w-0">
                  <div className="font-bold text-sm truncate">{b.name}</div>
                  <div className="text-xs text-stone-500 flex items-center gap-2 flex-wrap">
                    {b.igHandle && <span>📷{b.igHandle}</span>}
                    {b.threadsHandle && <span>@{b.threadsHandle}</span>}
                    <span>第{b.visitNo}次</span>
                  </div>
                </div>
                <Seal tone={b.source === "self" ? "gold" : "ink"}>{b.source === "self" ? "自約" : "店員開位"}</Seal>
              </div>
            ))}
          </div>
        </div>
      ))}
      {bookings.length === 0 && <p className="text-sm text-stone-400">仲未有記錄，撳「開位」加第一筆。</p>}
    </div>
  );
}

/* =========================================================
   8. 訪客記錄搜尋
   ========================================================= */
function LogTab() {
  const [bookings, setBookings] = useState([]);
  const [search, setSearch] = useState("");
  useEffect(() => listenBookings(setBookings), []);
  const results = bookings.filter((b) => {
    const s = search.toLowerCase();
    return b.name?.toLowerCase().includes(s) || b.igHandle?.toLowerCase().includes(s) || b.threadsHandle?.toLowerCase().includes(s);
  }).sort((a, b) => b.date.localeCompare(a.date));

  return (
    <div>
      <h2 className="text-xl font-extrabold flex items-center gap-2 mb-3">🔍 訪客記錄</h2>
      <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="輸入名 / IG / Threads 帳號，查返有冇嚟過" className="w-full mb-4 px-3 py-2 rounded-sm border border-[#C9A66B] bg-white text-sm" />
      <div className="space-y-2">
        {results.map((b) => (
          <div key={b.id} className="flex items-center justify-between rounded-md border border-[#C9A66B] bg-white/60 p-3">
            <div>
              <div className="font-bold text-sm">{b.name}</div>
              <div className="text-xs text-stone-500 flex items-center gap-2 flex-wrap">
                {b.igHandle && <span>📷{b.igHandle}</span>}
                {b.threadsHandle && <span>@{b.threadsHandle}</span>}
                <span>{fmtDate(b.date)} {b.time}</span>
              </div>
            </div>
            <div className="flex items-center gap-2 shrink-0">
              <Seal tone="gold">第 {b.visitNo} 次</Seal>
              <Seal tone={b.status === "arrived" ? "ink" : "vermilion"}>{b.status === "arrived" ? "已到" : "未到"}</Seal>
            </div>
          </div>
        ))}
        {results.length === 0 && <p className="text-sm text-stone-400">搵唔到相關記錄。</p>}
      </div>
    </div>
  );
}

/* =========================================================
   9. 成效追蹤 (admin)
   ========================================================= */
function Effectiveness() {
  const [bookings, setBookings] = useState([]);
  useEffect(() => listenBookings(setBookings), []);
  const arrived = bookings.filter((b) => b.status === "arrived").sort((a, b) => b.date.localeCompare(a.date));

  return (
    <div>
      <h2 className="text-xl font-extrabold flex items-center gap-2 mb-3">🔥 成效追蹤（第3日 / 第7日）</h2>
      <div className="space-y-4">
        {arrived.map((b) => (
          <div key={b.id} className="rounded-md border border-[#C9A66B] bg-white/60 p-3">
            <div className="font-bold text-sm mb-2">{b.name} <span className="text-stone-400 font-normal">· {b.igHandle || b.threadsHandle} · {fmtDate(b.date)}</span></div>
            <div className="grid grid-cols-2 gap-3">
              {["d3", "d7"].map((phase) => (
                <div key={phase} className="bg-white rounded-sm border border-stone-200 p-2">
                  <div className="text-xs font-bold text-[#B8262A] mb-1">{phase === "d3" ? "第 3 日" : "第 7 日"}</div>
                  {["views", "likes", "comments"].map((f) => (
                    <div key={f} className="flex items-center justify-between mb-1">
                      <span className="text-[11px] text-stone-500">{f === "views" ? "觀看" : f === "likes" ? "讚好" : "留言"}</span>
                      <input type="number" defaultValue={b.eff?.[phase]?.[f] ?? ""} onBlur={(e) => updateEffectiveness(b.id, phase, f, e.target.value, b.eff?.[phase])} className="w-20 text-right text-xs border border-stone-300 rounded-sm px-1 py-0.5" />
                    </div>
                  ))}
                </div>
              ))}
            </div>
          </div>
        ))}
        {arrived.length === 0 && <p className="text-sm text-stone-400">未有已到嘅記錄。</p>}
      </div>
    </div>
  );
}

/* =========================================================
   10. 每月統計 (admin)
   ========================================================= */
function Monthly() {
  const [bookings, setBookings] = useState([]);
  const [daily, setDaily] = useState([]);
  useEffect(() => listenBookings(setBookings), []);
  useEffect(() => listenDaily(setDaily), []);

  const months = {};
  bookings.filter((b) => b.status === "arrived").forEach((b) => {
    const m = b.date.slice(0, 7);
    months[m] = months[m] || { foodieCount: 0 };
    months[m].foodieCount += 1;
  });
  daily.forEach((d) => {
    const m = d.date.slice(0, 7);
    months[m] = months[m] || { foodieCount: 0 };
    if (!months[m].first || d.date < months[m].first.date) months[m].first = d;
    if (!months[m].last || d.date > months[m].last.date) months[m].last = d;
  });
  const rows = Object.keys(months).sort().reverse().map((m) => {
    const info = months[m];
    const waGrowth = info.first && info.last ? (info.last.waMembers ?? 0) - (info.first.waMembers ?? 0) : null;
    const igGrowth = info.first && info.last ? (info.last.igFollowers ?? 0) - (info.first.igFollowers ?? 0) : null;
    return { month: m, foodieCount: info.foodieCount, waGrowth, igGrowth };
  });

  return (
    <div>
      <h2 className="text-xl font-extrabold flex items-center gap-2 mb-3">📈 每月統計</h2>
      <p className="text-xs text-stone-500 mb-3">WhatsApp / IG-Threads 增長由「每日統計」自動計出嚟（嗰個月第一日 vs 最後一日）。</p>
      <div className="space-y-3">
        {rows.map((m) => (
          <div key={m.month} className="rounded-md border border-[#C9A66B] bg-white/60 p-4 grid grid-cols-3 gap-3 text-center">
            <div className="col-span-3 font-bold text-[#B8262A] mb-1">{m.month}</div>
            <div><div className="text-2xl font-extrabold">{m.foodieCount}</div><div className="text-[11px] text-stone-500">食評家嚟訪</div></div>
            <div><div className="text-2xl font-extrabold text-[#8a9a3c]">{m.waGrowth === null ? "—" : `${m.waGrowth >= 0 ? "+" : ""}${m.waGrowth}`}</div><div className="text-[11px] text-stone-500">WhatsApp 群組新增</div></div>
            <div><div className="text-2xl font-extrabold text-[#8a9a3c]">{m.igGrowth === null ? "—" : `${m.igGrowth >= 0 ? "+" : ""}${m.igGrowth}`}</div><div className="text-[11px] text-stone-500">IG/Threads 新 Follower</div></div>
          </div>
        ))}
        {rows.length === 0 && <p className="text-sm text-stone-400">未有數據，記錄多幾日「每日統計」就會見到。</p>}
      </div>
    </div>
  );
}

/* =========================================================
   11. 每日統計 (admin only)
   ========================================================= */
function Daily() {
  const [daily, setDaily] = useState([]);
  const [newDate, setNewDate] = useState(new Date().toISOString().slice(0, 10));
  useEffect(() => listenDaily(setDaily), []);
  const sorted = [...daily].sort((a, b) => a.date.localeCompare(b.date));

  const addToday = async () => {
    if (sorted.find((d) => d.date === newDate)) return;
    await upsertDaily(newDate, { revenue: 0, waMembers: 0, igFollowers: 0 });
  };

  const Delta = ({ curr, prev }) => {
    if (prev == null || curr == null) return <span className="text-stone-400 text-xs">—</span>;
    const diff = curr - prev;
    if (diff === 0) return <span className="text-stone-500 text-xs">持平</span>;
    const up = diff > 0;
    return <span className={`text-xs font-semibold ${up ? "text-[#8a9a3c]" : "text-[#B8262A]"}`}>{up ? "▲" : "▼"} {up ? "+" : ""}{diff.toLocaleString()}</span>;
  };

  return (
    <div>
      <h2 className="text-xl font-extrabold flex items-center gap-2 mb-1">🛡️ 每日統計</h2>
      <p className="text-xs text-stone-500 mb-3">只有管理員睇到呢頁。改個欄位、離開input就自動存返。</p>
      <div className="flex gap-2 mb-3">
        <input type="date" value={newDate} onChange={(e) => setNewDate(e.target.value)} className="border border-[#C9A66B] rounded-sm px-2 py-1.5 text-sm bg-white" />
        <button onClick={addToday} className="flex items-center gap-1 bg-[#1C1917] text-white text-sm font-bold px-3 py-1.5 rounded-sm">＋ 新增一日</button>
      </div>
      <div className="overflow-x-auto">
        <table className="w-full text-sm border-collapse">
          <thead><tr className="text-left text-xs text-stone-500 border-b border-[#C9A66B]">
            <th className="py-2 pr-2">日期</th><th className="py-2 pr-2">營業額(HK$)</th><th className="py-2 pr-2">群組人數</th><th className="py-2 pr-2">Followers</th><th className="py-2 pr-2">升跌</th>
          </tr></thead>
          <tbody>
            {sorted.map((row, idx) => {
              const prev = sorted[idx - 1];
              return (
                <tr key={row.date} className="border-b border-stone-200">
                  <td className="py-2 pr-2 font-bold whitespace-nowrap">{fmtDate(row.date)}</td>
                  <td className="py-2 pr-2"><input type="number" defaultValue={row.revenue} onBlur={(e) => upsertDaily(row.date, { revenue: Number(e.target.value) || 0 })} className="w-24 border border-stone-300 rounded-sm px-1 py-0.5 text-xs" /></td>
                  <td className="py-2 pr-2"><input type="number" defaultValue={row.waMembers} onBlur={(e) => upsertDaily(row.date, { waMembers: Number(e.target.value) || 0 })} className="w-20 border border-stone-300 rounded-sm px-1 py-0.5 text-xs" /></td>
                  <td className="py-2 pr-2"><input type="number" defaultValue={row.igFollowers} onBlur={(e) => upsertDaily(row.date, { igFollowers: Number(e.target.value) || 0 })} className="w-20 border border-stone-300 rounded-sm px-1 py-0.5 text-xs" /></td>
                  <td className="py-2 pr-2 space-y-0.5"><Delta curr={row.revenue} prev={prev?.revenue} /><br /><Delta curr={row.igFollowers} prev={prev?.igFollowers} /></td>
                </tr>
              );
            })}
          </tbody>
        </table>
        {sorted.length === 0 && <p className="text-sm text-stone-400 mt-3">未有數據，撳「新增一日」開始記錄。</p>}
      </div>
    </div>
  );
}

/* =========================================================
   12. 帳號管理 (admin only)
   ========================================================= */
function Accounts() {
  const [accounts, setAccounts] = useState([]);
  const [form, setForm] = useState({ username: "", name: "", role: "staff" });
  useEffect(() => listenAccounts(setAccounts), []);

  const add = async () => {
    if (!form.username || !form.name) return;
    await addAccountRole(usernameToEmail(form.username), form.name, form.role);
    setForm({ username: "", name: "", role: "staff" });
  };

  return (
    <div>
      <h2 className="text-xl font-extrabold flex items-center gap-2 mb-3">👤 帳號管理</h2>
      <p className="text-xs text-stone-500 mb-3">
        新增帳號分兩步：(1) Firebase Console → Authentication 加返個帳號，電郵填「帳號名@yakiniku-time.local」，設密碼；
        (2) 喺呢頁填返同一個帳號名，指定佢角色。
      </p>
      <div className="space-y-2 mb-4">
        {accounts.map((a) => (
          <div key={a.email} className="flex items-center justify-between rounded-md border border-[#C9A66B] bg-white/60 p-3">
            <div className="flex items-center gap-2">
              <Seal tone={a.role === "admin" ? "vermilion" : "ink"}>{a.role === "admin" ? "管理員" : "店員"}</Seal>
              <div><div className="font-bold text-sm">{a.name}</div><div className="text-xs text-stone-500">帳號名：{emailToUsername(a.email)}</div></div>
            </div>
            <button onClick={() => removeAccountRole(a.email)} className="text-stone-400 hover:text-[#B8262A]">✕</button>
          </div>
        ))}
      </div>
      <div className="bg-white/70 border border-[#C9A66B] rounded-md p-3 flex flex-col gap-2">
        <input placeholder="帳號名稱" value={form.username} onChange={(e) => setForm({ ...form, username: e.target.value })} className="border border-[#C9A66B] rounded-sm px-2 py-1.5 text-sm bg-white" />
        <input placeholder="稱呼" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} className="border border-[#C9A66B] rounded-sm px-2 py-1.5 text-sm bg-white" />
        <div className="flex gap-2">
          <select value={form.role} onChange={(e) => setForm({ ...form, role: e.target.value })} className="flex-1 border border-[#C9A66B] rounded-sm px-2 py-1.5 text-sm bg-white">
            <option value="staff">店員</option><option value="admin">管理員</option>
          </select>
          <button onClick={add} className="flex items-center justify-center gap-1 bg-[#1C1917] text-white text-sm font-bold px-3 py-1.5 rounded-sm">＋ 新增</button>
        </div>
      </div>
    </div>
  );
}

/* =========================================================
   13. 主App (登入後嘅內部系統)
   ========================================================= */
function MainApp() {
  const [authUser, setAuthUser] = useState(undefined);
  const [account, setAccount] = useState(null);
  const [tab, setTab] = useState("schedule");

  useEffect(() => onAuthStateChanged(auth, async (user) => {
    setAuthUser(user || null);
    if (user?.email) setAccount(await getAccountRole(user.email));
    else setAccount(null);
  }), []);

  if (authUser === undefined) return <div className="min-h-screen flex items-center justify-center bg-[#F3EBD9] text-stone-500">載入緊…</div>;
  if (!authUser) return <Login />;
  if (!account) return (
    <div className="min-h-screen flex items-center justify-center bg-[#F3EBD9] px-4 text-center">
      <div><p className="font-bold mb-2">呢個帳號未設定權限</p>
      <p className="text-sm text-stone-500 mb-4">請叫管理員喺「帳號管理」加返你嘅帳號名（{emailToUsername(authUser.email)}）</p>
      <button onClick={() => signOut(auth)} className="text-sm underline text-[#B8262A]">登出</button></div>
    </div>
  );

  const role = account.role;
  const tabs = [
    { id: "schedule", label: "時間表", icon: "📅" },
    { id: "log", label: "訪客記錄", icon: "🔍" },
  ];
  if (role === "admin") tabs.push(
    { id: "eff", label: "成效追蹤", icon: "🔥" },
    { id: "monthly", label: "月結統計", icon: "📈" },
    { id: "daily", label: "每日統計", icon: "🛡️" },
    { id: "accounts", label: "帳號管理", icon: "👤" },
  );

  return (
    <div className="min-h-screen bg-[#F3EBD9] text-[#211B14]">
      <header className="border-b-4 border-[#1C1917] bg-[#1C1917] text-[#F3EBD9]">
        <div className="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
          <div className="flex items-center gap-3">
            <LogoMark size={48} />
            <div><h1 className="text-lg font-extrabold leading-tight tracking-wide">燒肉時刻 · 食評家記錄</h1>
            <p className="text-[11px] text-[#C9A66B] tracking-widest uppercase">Yakiniku Time · KOL Manager</p></div>
          </div>
          <div className="flex items-center gap-3">
            <span className="text-xs text-[#C9A66B] hidden sm:inline">{account.name} · {role === "admin" ? "管理員" : "店員"}</span>
            <button onClick={() => signOut(auth)} className="text-xs font-bold text-[#F3EBD9] border border-[#C9A66B] rounded-sm px-2 py-1.5">登出</button>
          </div>
        </div>
        <nav className="max-w-5xl mx-auto px-4 flex flex-wrap gap-1">
          {tabs.map((t) => (
            <button key={t.id} onClick={() => setTab(t.id)} className={`flex items-center gap-1.5 px-3 py-2 text-sm font-bold whitespace-nowrap border-b-2 transition ${tab === t.id ? "border-[#B8262A] text-[#F3EBD9]" : "border-transparent text-[#8a8067]"}`}>
              {t.icon} {t.label}
            </button>
          ))}
        </nav>
      </header>
      <main className="max-w-5xl mx-auto px-4 py-5 pb-16">
        {tab === "schedule" && <Schedule />}
        {tab === "log" && <LogTab />}
        {tab === "eff" && role === "admin" && <Effectiveness />}
        {tab === "monthly" && role === "admin" && <Monthly />}
        {tab === "daily" && role === "admin" && <Daily />}
        {tab === "accounts" && role === "admin" && <Accounts />}
      </main>
      <footer className="border-t border-[#C9A66B] py-3 text-center text-[11px] text-stone-500">燒肉時刻 · 內部管理系統</footer>
    </div>
  );
}

/* =========================================================
   14. 路由：#/book 係foodie自助頁，其餘全部係內部系統
   ========================================================= */
function Root() {
  const [hash, setHash] = useState(window.location.hash);
  useEffect(() => {
    const onHashChange = () => setHash(window.location.hash);
    window.addEventListener("hashchange", onHashChange);
    return () => window.removeEventListener("hashchange", onHashChange);
  }, []);
  return hash.startsWith("#/book") ? <PublicBooking /> : <MainApp />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
